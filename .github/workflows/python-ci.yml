name: Python CI

on:
  # The default branch is "develop": the old filter on "main" meant CI never ran.
  push:
    branches: [ "main", "develop" ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install tools
        run: pip install flake8 pytest
      - name: Lint
        run: flake8 cli/ gui/ tabops/ tests/
      # osascript is mocked: the tests run on Linux.
      - name: Test
        run: pytest -q
